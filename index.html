<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المنيو الإلكتروني</title>
<meta name="theme-color" content="#0F3D3E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لوحة المطعم">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#F6F7F4;--card:#fff;--ink:#12302F;--mut:#6B7B79;--brand:#0F3D3E;--gold:#F2A900;--red:#B3261E;--line:#DDE3E0;--ok:#1E7A4C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A1A;--card:#162626;--ink:#E8F0EE;--mut:#93A6A3;--brand:#0A2A2B;--line:#2A3D3C;--red:#FF8A80;--ok:#6FD3A1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh}
.hero{background:var(--bar,#0F3D3E);color:var(--bart,#fff);padding:22px 16px 18px;display:flex;gap:12px;align-items:center}
.hero h1{margin:0;font-size:26px;font-weight:800}.hero p{margin:4px 0 0;opacity:.8;font-size:13px}
.logo{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.chips,.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px}
.chips button,.tabs button{white-space:nowrap;padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Cairo,Tahoma;cursor:pointer}
.chips button.on,.tabs button.on{background:var(--gold);border-color:var(--gold);color:#12302F}
.list,.own{padding:8px 12px 30px;display:grid;gap:10px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center}
.pic{width:84px;height:84px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:36px;background:#E3E8E5 center/cover;position:relative;overflow:hidden}
.pic.out::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.info{flex:1;min-width:0}.info b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.out{opacity:.55}
.price{font-weight:800;font-size:17px;color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .price{color:var(--gold)}}
.cur,.note{font-size:13px;color:var(--mut);font-weight:400;margin:0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;margin-top:4px}
.tag.no{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.tag.yes{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.qty{display:flex;align-items:center;gap:10px;margin-top:6px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.meta .tag{margin-top:0}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--gold);color:#12302F;font:800 17px Cairo,Tahoma;cursor:pointer}
.order{margin-top:6px;padding:5px 14px;border:0;border-radius:8px;background:#168A4A;color:#fff;font:700 13px Cairo,Tahoma,sans-serif;cursor:pointer}
.cartbar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.cartbar input{flex:1}.cartbar .btn{flex:none}
.done{text-align:center;padding:40px 20px}.big{font-size:84px;font-weight:800;color:var(--gold);line-height:1}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 15px Cairo,Tahoma;width:100%}
.row input[type=number]{width:100px}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px Cairo,Tahoma;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#12302F}
.add{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}.add h3{margin:0}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i::after{right:23px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bar,#B71C1C);color:var(--bart,#FFD60A)}
.top b{font-size:17px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.top .logo{width:40px;height:40px;border-radius:10px}.layout{display:block}.top .btn{background:none;color:var(--bart,#FFD60A);border-color:currentColor}
#qr{background:#fff;padding:14px;border-radius:14px;display:inline-block;line-height:0}
.pv{padding:14px;border-radius:10px;font-weight:800;text-align:center}
input[type=color]{width:56px;height:36px;padding:2px;vertical-align:middle;cursor:pointer}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;text-align:right}.tb th{background:var(--bg)}.tb tfoot td{font-weight:800;background:var(--bg)}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px}summary{cursor:pointer;font-weight:600}
@media(min-width:900px){
#app.wide{max-width:none}
.wide .top{padding:14px 32px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.wide .top b{font-size:22px}.wide .top .logo{width:48px;height:48px}.wide .top .btn{padding:9px 18px;font-size:14px}
.layout{display:grid;grid-template-columns:250px 1fr;align-items:start}
.layout .tabs{flex-direction:column;overflow:visible;padding:20px 16px;gap:8px;background:var(--card);border-inline-end:1px solid var(--line);position:sticky;top:0;min-height:calc(100vh - 76px)}
.layout .tabs button{text-align:start;border-radius:12px;padding:12px 16px;font-size:15px}
.wide .own,.layout .own{padding:28px 36px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));align-content:start;gap:14px}
.wide .own>.add,.wide .own>.note,.wide .own>.full{grid-column:1/-1}
.wide .own>.add{max-width:560px}
}
#t{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}#t.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="t"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut,updatePassword,reauthenticateWithCredential,EmailAuthProvider}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,collection,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,orderBy,runTransaction,writeBatch}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN="khalid.free2000@gmail.com"; // إيميل المصمم (نفسه في قواعد الأمان)
const CUR="د.ل";
const cfg={apiKey:"AIzaSyBQvXih9GJSfHfgaQY6IXqU2Oj0PVl6Oww",authDomain:"qr-menu-329aa.firebaseapp.com",projectId:"qr-menu-329aa",storageBucket:"qr-menu-329aa.firebasestorage.app",messagingSenderId:"29443094275",appId:"1:29443094275:web:1d54fcfd064a4467df5b36"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),A=$("#app");
const fmt=n=>Number(n).toLocaleString("en-US");
const toEm=u=>{u=u.trim().toLowerCase();return u.includes("@")?u:u+"@qrmenu.app"};
let ac=null;
document.addEventListener("click",()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}});
const beep=()=>{try{if(!ac)return;[0,.5,1].forEach(t=>[880,1175].forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);const st=ac.currentTime+t+k*.18;g.gain.setValueAtTime(.35,st);g.gain.exponentialRampToValueAtTime(.001,st+.16);o.start(st);o.stop(st+.17)}));navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const x=$("#t");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),1500)};
const rs=(f,w,cb)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,w/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};i.src=r.result};r.readAsDataURL(f)};
const pic=(i,o)=>`<div class="pic ${o?"out":""}" style="${i.img?`background-image:url(${i.img})`:""}">${i.img?"":"🍽️"}</div>`;
const q=new URLSearchParams(location.search);
const applyTheme=R=>{const s=document.documentElement.style;R.c1?s.setProperty("--bar",R.c1):s.removeProperty("--bar");R.c2?s.setProperty("--bart",R.c2):s.removeProperty("--bart");const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=R.c1||"#0F3D3E"};
const resetTheme=()=>applyTheme({});
const fromLogo=src=>new Promise(res=>{const im=new Image();im.onerror=()=>res(null);im.onload=()=>{
  const c=document.createElement("canvas");c.width=c.height=40;const x=c.getContext("2d");x.drawImage(im,0,0,40,40);const d=x.getImageData(0,0,40,40).data,b={};
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],bl=d[i+2];if(d[i+3]<200)continue;const mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);if(mx>235&&mn>215)continue;if(mx<30)continue;
    const k=[r,g,bl].map(v=>Math.round(v/48)).join(","),e=b[k]||(b[k]={w:0,n:0,r:0,g:0,b:0});e.w+=1+(mx-mn)/64;e.n++;e.r+=r;e.g+=g;e.b+=bl}
  const cols=Object.values(b).sort((a,z)=>z.w-a.w).map(e=>[Math.round(e.r/e.n),Math.round(e.g/e.n),Math.round(e.b/e.n)]);
  const L=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
  const ct=(p,q)=>(Math.max(L(p),L(q))+.05)/(Math.min(L(p),L(q))+.05);
  const hex=c=>"#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
  if(!cols.length)return res({c1:"#0F3D3E",c2:"#FFFFFF"});
  const p=cols[0];let t=cols.slice(1).find(q=>ct(p,q)>=3&&Math.abs(q[0]-p[0])+Math.abs(q[1]-p[1])+Math.abs(q[2]-p[2])>120);
  if(!t)t=ct(p,[255,255,255])>=ct(p,[0,0,0])?[255,255,255]:[0,0,0];
  res({c1:hex(p),c2:hex(t)})};im.src=src});


if(!q.get("r")){const l=document.createElement("link");l.rel="manifest";l.href="manifest.json";document.head.appendChild(l);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(q.get("r"))customer(q.get("r"));
else onAuthStateChanged(auth,u=>u?(u.email===ADMIN?admin():owner(u.uid,false)):login());

/* ---------- الزبون ---------- */
async function customer(slug){
  const s=await getDocs(query(collection(db,"restaurants"),where("slug","==",slug)));
  if(s.empty){A.innerHTML='<div class="done">المطعم غير موجود</div>';return}
  const rid=s.docs[0].id,R=s.docs[0].data();applyTheme(R);
  let items=[],cat=null,cart={},tb="",ord=null,un=null;
  const watch=id=>{un&&un();un=onSnapshot(doc(db,"restaurants",rid,"orders",id),d=>{ord=d.exists()?d.data():null;draw()})};
  const old=localStorage.getItem("o_"+rid);if(old)watch(old);
  onSnapshot(collection(db,"restaurants",rid,"items"),sn=>{items=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));draw()});
  function draw(){
    if(ord){A.innerHTML=`<div class="done"><p class="note">تم استلام طلبك</p><div class="big">${ord.n}</div><p>رقم الطلبية · ${ord.st?"جاهز للاستلام ✓":"قيد التجهيز"}</p><p class="note">${ord.lines.map(esc).join("، ")}</p><p class="price">${fmt(ord.t)} ${CUR}</p><button class="btn pri" data-a="new">طلب جديد</button></div>`;return}
    const cats=[...new Set(items.map(i=>i.cat))];if(!cats.includes(cat))cat=cats[0];
    const cnt=Object.values(cart).reduce((a,b)=>a+b,0),tot=items.reduce((a,i)=>a+(cart[i.id]||0)*i.price,0);
    A.innerHTML=`<div class="hero">${R.logo?`<img class="logo" src="${R.logo}" alt="">`:""}<div><h1>${esc(R.name)}</h1><p>اختر وجباتك وأرسل الطلب</p></div></div>
    <div class="chips">${cats.map(c=>`<button data-a="c" data-v="${esc(c)}" class="${c==cat?"on":""}">${esc(c)}</button>`).join("")}</div>
    <div class="list">${items.filter(i=>i.cat==cat).map(i=>`<div class="item">${pic(i,!i.ok)}<div class="info ${i.ok?"":"out"}"><b>${esc(i.name)}</b><div class="meta"><span class="price">${fmt(i.price)} <span class="cur">${CUR}</span></span><span class="tag ${i.ok?"yes":"no"}">${i.ok?"متوفر":"غير متوفر حالياً"}</span></div>${i.ok?(cart[i.id]?`<div class="qty"><button data-a="p" data-id="${i.id}" aria-label="زيادة">+</button><b>${cart[i.id]}</b><button data-a="m" data-id="${i.id}" aria-label="إنقاص">−</button></div>`:`<button class="order" data-a="p" data-id="${i.id}">اطلب الآن</button>`):""}</div></div>`).join("")}</div>
    ${cnt?`<div class="cartbar"><input id="tb" value="${esc(tb)}" placeholder="رقم الطاولة (اختياري)"><button class="btn pri" data-a="send">إرسال الطلب · ${cnt} · ${fmt(tot)} ${CUR}</button></div>`:""}`;
  }
  A.oninput=e=>{if(e.target.id=="tb")tb=e.target.value};
  A.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id,y=scrollY;
    if(a=="c")cat=b.dataset.v;
    if(a=="p")cart[id]=(cart[id]||0)+1;
    if(a=="m"){cart[id]--;if(cart[id]<1)delete cart[id]}
    if(a=="new"){un&&un();un=null;ord=null;localStorage.removeItem("o_"+rid)}
    if(a=="send"){
      const lines=items.filter(i=>cart[i.id]).map(i=>cart[i.id]+"× "+i.name),t=items.reduce((s,i)=>s+(cart[i.id]||0)*i.price,0);
      const cr=doc(db,"counters",rid),or=doc(collection(db,"restaurants",rid,"orders"));
      try{await runTransaction(db,async tx=>{const c=await tx.get(cr),n=c.exists()?c.data().n+1:101;tx.set(cr,{n});tx.set(or,{n,lines,its:items.filter(i=>cart[i.id]).map(i=>({n:i.name,q:cart[i.id],p:i.price})),t,tb:tb.trim(),st:0,ts:Date.now()})});
        cart={};tb="";localStorage.setItem("o_"+rid,or.id);watch(or.id);return}catch(x){toast("تعذر إرسال الطلب، حاول مرة أخرى");return}
    }
    draw();scrollTo(0,y)};
}

/* ---------- الدخول ---------- */
function login(){
  A.className="";resetTheme();A.innerHTML='<div class="own"><h2>تسجيل الدخول</h2><input id="e" placeholder="اسم المستخدم أو الإيميل" dir="ltr" autocapitalize="none" autocomplete="username"><input id="p" type="password" placeholder="كلمة السر"><button class="btn pri" id="go">دخول</button></div>';
  A.onclick=null;
  $("#go").onclick=async()=>{const v=$("#e").value.trim().toLowerCase();let em=toEm(v);
    if(!v.includes("@")){try{const r=await getDocs(query(collection(db,"restaurants"),where("username","==",v)));if(!r.empty&&r.docs[0].data().em)em=r.docs[0].data().em}catch(x){}}
    signInWithEmailAndPassword(auth,em,$("#p").value).catch(()=>toast("بيانات الدخول غير صحيحة"))};
}
const top=(t,back,lg)=>`<div class="top"><span class="brand">${lg?`<img class="logo" src="${lg}" alt="">`:""}<b>${esc(t)}</b></span><span>${back?'<button class="btn" data-a="back">رجوع</button> ':""}<button class="btn" data-a="out">خروج</button></span></div>`;

/* ---------- المصمم ---------- */
async function admin(){
  const s=await getDocs(collection(db,"restaurants"));
  A.className="wide";resetTheme();A.innerHTML=top("لوحة المصمم",false,"icon-192.png")+`<div class="own"><div class="add"><h3>مطعم جديد</h3><input id="n" placeholder="اسم المطعم"><input id="s" placeholder="الرابط بالإنجليزي مثل pizza-ali" dir="ltr"><input id="e" placeholder="اسم المستخدم لصاحب المطعم (إنجليزي) مثل: alreem" dir="ltr" autocapitalize="none"><input id="p" placeholder="كلمة سر (6 أحرف فأكثر)" dir="ltr"><button class="btn pri" data-a="mk">إنشاء المطعم</button></div>
  ${s.docs.map(d=>`<div class="item"><div class="info"><b>${esc(d.data().name)}</b><span class="note" dir="ltr">?r=${esc(d.data().slug)}${d.data().username?" · @"+esc(d.data().username):""}</span></div><button class="btn" data-a="mg" data-id="${d.id}">إدارة</button></div>`).join("")}</div>`;
  A.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
    if(a=="out")signOut(auth);
    if(a=="mg")owner(b.dataset.id,true);
    if(a=="mk"){const n=$("#n").value.trim(),sl=$("#s").value.trim().toLowerCase(),em=toEm($("#e").value),pw=$("#p").value;
      if(!n||!/^[a-z0-9-]+$/.test(sl)||!/^([a-z0-9._-]{3,}|\S+@\S+)$/i.test($("#e").value.trim())||pw.length<6)return toast("راجع البيانات: الرابط واسم المستخدم حروف إنجليزية وأرقام فقط (3 أحرف على الأقل)");
      if(!(await getDocs(query(collection(db,"restaurants"),where("slug","==",sl)))).empty)return toast("هذا الرابط مستخدم");
      const raw=$("#e").value.trim().toLowerCase();
      if(!raw.includes("@")&&!(await getDocs(query(collection(db,"restaurants"),where("username","==",raw)))).empty)return toast("اسم المستخدم مستخدم");
      try{const a2=getAuth(initializeApp(cfg,"s"+Date.now())),c=await createUserWithEmailAndPassword(a2,em,pw);
        await setDoc(doc(db,"restaurants",c.user.uid),{name:n,slug:sl,logo:"",...(raw.includes("@")?{}:{username:raw,em})});await signOut(a2);toast("تم إنشاء المطعم");admin()}
      catch(x){console.error(x);alert("سبب الخطأ: "+(x.code||x.message))}}};
}

/* ---------- صاحب المطعم ---------- */
function owner(rid,adm){
  A.className="wide";
  let R={},items=[],orders=[],tab="i",img=null,firstO=true,jc=false;const rr=doc(db,"restaurants",rid);
  let ordUn=null,curClose=-1;
  const subOrders=()=>{ordUn&&ordUn();firstO=true;curClose=R.lastClose||0;ordUn=onSnapshot(query(collection(rr,"orders"),where("ts",">",curClose),orderBy("ts","desc")),sn=>{if(!firstO)sn.docChanges().forEach(c=>{if(c.type=="added"&&!c.doc.data().st){beep();toast("🔔 طلب جديد رقم "+c.doc.data().n)}});firstO=false;orders=sn.docs.map(d=>({id:d.id,...d.data()}));draw()})};
  const U=[onSnapshot(rr,d=>{R=d.data()||{};applyTheme(R);if((R.lastClose||0)!==curClose)subOrders();draw()}),
    onSnapshot(collection(rr,"items"),sn=>{items=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));draw()}),
    ()=>ordUn&&ordUn()];
  const url=()=>location.origin+location.pathname+"?r="+R.slug;
  const pv=()=>{const e=$("#pv");if(e){e.style.background=$("#c1").value;e.style.color=$("#c2").value}};
  A.oninput=e=>{if(e.target.id=="c1"||e.target.id=="c2")pv()};
  const agg=list=>{const m={};let pieces=0,total=0;list.forEach(o=>{total+=o.t;const its=o.its||(o.lines||[]).map(l=>{const x=/^(\d+)× (.+)$/.exec(l);if(!x)return null;const it=items.find(i=>i.name==x[2]);return{n:x[2],q:+x[1],p:it?it.price:0}}).filter(Boolean);its.forEach(i=>{const r=m[i.n]||(m[i.n]={name:i.n,q:0,total:0});r.q+=i.q;r.total+=i.q*i.p;pieces+=i.q})});const ns=list.map(o=>o.n);return{rows:Object.values(m).sort((a,b)=>b.total-a.total),pieces,total,count:list.length,from:ns.length?Math.min(...ns):0,to:ns.length?Math.max(...ns):0}};
  const tbl=r=>`<table class="tb"><thead><tr><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي (${CUR})</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.q}</td><td>${fmt(x.q?Math.round(x.total/x.q*100)/100:0)}</td><td>${fmt(x.total)}</td></tr>`).join("")}</tbody><tfoot><tr><td>المجموع</td><td>${r.pieces}</td><td></td><td>${fmt(r.total)}</td></tr></tfoot></table>`;
  const info=r=>r.count?`عدد الفواتير: ${r.count} (من رقم ${r.from} إلى رقم ${r.to})`:"لا توجد مبيعات";
  const nowTxt=()=>new Date().toLocaleString("en-GB",{hour12:false}).replace(",","");
  const salesView=()=>{const r=agg(orders),cl=R.closures||[];
    let h=`<div class="add full"><h3>مبيعات اليوم (قبل الإقفال)</h3><p class="note">${info(r)}</p>${r.count?tbl(r)+`<div class="row"><button class="btn" data-a="prn">🖨️ طباعة / PDF</button><button class="btn pri" data-a="close">✅ إقفال اليوم وبدء يوم جديد</button></div>`:'<p class="note">لا توجد مبيعات بعد.</p>'}<p class="note">عند الإقفال تُحفظ المبيعات في التقارير السابقة وتُفرَّغ قائمة الطلبات، ويستمر ترقيم الفواتير من آخر رقم.</p></div>`;
    h+=`<div class="add full"><h3>التقارير السابقة</h3>${cl.length?cl.map((c,k)=>`<details ${jc&&k==0?"open":""}><summary>${esc(c.date)} · ${c.count} فاتورة · ${fmt(c.total)} ${CUR}</summary><p class="note">${info(c)}</p>${tbl(c)}<div class="row"><button class="btn" data-a="prc" data-id="${k}">🖨️ طباعة / PDF</button></div></details>`).join(""):'<p class="note">لا توجد تقارير بعد.</p>'}</div>`;
    return h};
  const printRep=(r,title)=>{const w=window.open("","_blank");if(!w)return toast("اسمح بالنوافذ المنبثقة للطباعة");
    w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Tahoma,Arial,sans-serif;margin:24px;color:#111}.h{display:flex;align-items:center;gap:12px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}.h img{width:60px;height:60px;object-fit:cover;border-radius:8px}h1{margin:0;font-size:22px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #888;padding:8px 10px;text-align:right}th{background:#eee}tfoot td{font-weight:bold;background:#f4f4f4}.m{margin:0 0 12px;font-size:14px}</style></head><body><div class="h">${R.logo?`<img src="${R.logo}" alt="">`:""}<div><h1>${esc(R.name)}</h1><div>${esc(title)}</div></div></div><p class="m">${info(r)}</p>${tbl(r)}<script>onload=function(){setTimeout(function(){print()},400)}<\/script></body></html>`);w.document.close()};
  const closeDay=async()=>{if(!orders.length)return toast("لا توجد مبيعات");const nw=orders.filter(o=>!o.st);
    if(!confirm((nw.length?`يوجد ${nw.length} طلب لم يُجهَّز بعد وسيُعتبر مُجهَّزاً. `:"")+"إقفال اليوم وحفظ التقرير وتفريغ الطلبات؟"))return;
    const r=agg(orders),now=Date.now(),c={id:now,date:nowTxt(),count:r.count,from:r.from,to:r.to,pieces:r.pieces,total:r.total,rows:r.rows};
    const b=writeBatch(db);nw.forEach(o=>b.update(doc(rr,"orders",o.id),{st:1}));b.update(rr,{lastClose:now,closures:[c,...(R.closures||[])].slice(0,60)});
    try{await b.commit();jc=true;toast("تم إقفال اليوم، يمكنك طباعة التقرير");draw()}catch(x){alert("تعذر الإقفال: "+(x.code||x.message))}};
  function draw(){
    const nw=orders.filter(o=>!o.st).length;
    let h=top(R.name||"...",adm,R.logo)+`<div class="layout"><div class="tabs">${[["i","🍽️ الوجبات"],["o","🛎️ الطلبات"+(nw?" ("+nw+")":"")],["m","📊 المبيعات"],["q","🔗 الرابط وQR"],["s","⚙️ الإعدادات"]].map(([k,v])=>`<button data-a="tab" data-v="${k}" class="${tab==k?"on":""}">${v}</button>`).join("")}</div><div class="own">`;
    if(tab=="i"){
      h+=items.map(i=>`<div class="item" style="align-items:flex-start">${pic(i)}<div class="info"><b>${esc(i.name)}</b><span class="note">${esc(i.cat)}</span><div class="row"><input type="number" min="0" value="${i.price}" data-a="p" data-id="${i.id}"><span class="cur">${CUR}</span></div><div class="row"><label class="sw"><input type="checkbox" data-a="t" data-id="${i.id}" ${i.ok?"checked":""}><i></i></label><span>${i.ok?"متوفر":"غير متوفر"}</span></div><div class="row"><label class="btn">📷 تغيير الصورة<input type="file" accept="image/*" data-a="f" data-id="${i.id}" hidden></label><button class="btn" data-a="del" data-id="${i.id}">حذف</button></div></div></div>`).join("");
      h+=`<div class="add"><h3>إضافة وجبة</h3><input id="in" placeholder="اسم الوجبة"><div class="row"><input id="ip" type="number" min="0" placeholder="السعر"><input id="ic" list="cl" placeholder="القسم (مثل: سندويشات)"><datalist id="cl">${[...new Set(items.map(i=>i.cat))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div><div class="row"><label class="btn">📷 اختر صورة<input type="file" accept="image/*" data-a="nf" hidden></label><span class="note" id="nfn">بدون صورة</span></div><button class="btn pri" data-a="add">حفظ الوجبة</button></div>`;
    }
    if(tab=="m")h+=salesView();
    if(tab=="s"){
      h+=`<div class="add"><h3>هوية المطعم</h3><input data-a="rn" value="${esc(R.name)}"><div class="row"><label class="btn">🖼️ رفع الشعار<input type="file" accept="image/*" data-a="lg" hidden></label>${R.logo?`<img class="logo" src="${R.logo}" alt="">`:'<span class="note">لا يوجد شعار</span>'}</div></div>`;
      h+=`<p class="note">الاسم والشعار يظهران في أعلى قائمة الزبائن وفي الشريط العلوي للوحة التحكم.</p>`;
      h+=`<div class="add"><h3>ألوان المطعم</h3><div class="row"><label>لون الشريط <input type="color" id="c1" value="${R.c1||"#B71C1C"}"></label><label>لون الكتابة <input type="color" id="c2" value="${R.c2||"#FFD60A"}"></label></div><div id="pv" class="pv" style="background:${R.c1||"#B71C1C"};color:${R.c2||"#FFD60A"}">${esc(R.name||"")} - معاينة</div><div class="row"><button class="btn" data-a="autoc">🎨 اختيار من الشعار تلقائياً</button><button class="btn pri" data-a="savec">حفظ الألوان</button></div></div>`;
      if(!adm&&auth.currentUser){const cu=auth.currentUser,internal=(cu.email||"").endsWith("@qrmenu.app"),un=R.username||(internal?cu.email.split("@")[0]:"");
        h+=`<div class="add"><h3>بيانات الدخول</h3>${internal?`<p class="note">اسم المستخدم الحالي: <b dir="ltr">${esc(un)}</b></p><input id="nu" dir="ltr" autocapitalize="none" placeholder="اسم مستخدم جديد (إنجليزي)"><button class="btn" data-a="su">حفظ اسم المستخدم</button>`:`<p class="note">تدخل حالياً بالإيميل: <b dir="ltr">${esc(cu.email)}</b></p>`}<input id="cp" type="password" placeholder="كلمة السر الحالية"><input id="np" type="password" placeholder="كلمة السر الجديدة (6 أحرف فأكثر)"><button class="btn pri" data-a="sp">تغيير كلمة السر</button></div>`}
    }
    if(tab=="o")h+='<p class="note">🔔 اترك هذه الصفحة مفتوحة ليصدر تنبيه صوتي عند وصول طلب جديد.</p>'+(orders.length?orders.map(o=>`<div class="item" style="align-items:flex-start"><div class="pic" style="background:var(--gold);font-weight:800;font-size:22px;color:#12302F">${o.n}</div><div class="info"><b>${o.tb?"طاولة "+esc(o.tb):"بدون طاولة"}</b><span class="note">${o.lines.map(esc).join("، ")}</span><br><span class="price">${fmt(o.t)} <span class="cur">${CUR}</span></span><div class="row"><span class="tag ${o.st?"yes":"no"}">${o.st?"جاهز":"جديد"}</span>${o.st?"":`<button class="btn pri" data-a="rd" data-id="${o.id}">تم التجهيز</button>`}</div></div></div>`).join(""):'<p class="note">لا توجد طلبات بعد.</p>');
    if(tab=="q")h+=`<div class="full" style="text-align:center"><div id="qr"></div><p class="note" dir="ltr" style="word-break:break-all;margin:12px 0">${esc(url())}</p><button class="btn pri" data-a="dl">تحميل صورة QR للطباعة</button></div>`;
    A.innerHTML=h+"</div></div>";
    if(tab=="q")new QRCode($("#qr"),{text:url(),width:240,height:240,correctLevel:QRCode.CorrectLevel.M});
  }
  A.onchange=e=>{const t=e.target,a=t.dataset.a,id=t.dataset.id,f=t.files&&t.files[0];
    if(a=="p")updateDoc(doc(rr,"items",id),{price:+t.value}).then(()=>toast("تم تحديث السعر"));
    if(a=="t")updateDoc(doc(rr,"items",id),{ok:t.checked});
    if(a=="f"&&f)rs(f,600,d=>updateDoc(doc(rr,"items",id),{img:d}));
    if(a=="lg"&&f)rs(f,200,d=>updateDoc(rr,{logo:d}).then(()=>toast("تم رفع الشعار")));
    if(a=="rn")updateDoc(rr,{name:t.value.trim()||R.name});
    if(a=="nf"&&f)rs(f,600,d=>{img=d;$("#nfn").textContent="تم اختيار الصورة ✓"})};
  A.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName=="INPUT")return;const a=b.dataset.a,id=b.dataset.id;
    if(a=="out"){U.forEach(f=>f());signOut(auth)}
    if(a=="back"){U.forEach(f=>f());admin()}
    if(a=="tab"){tab=b.dataset.v;jc=false;draw()}
    if(a=="prn")printRep(agg(orders),"مبيعات اليوم - "+nowTxt());
    if(a=="prc"){const c=(R.closures||[])[+id];if(c)printRep(c,"تقرير مبيعات - "+c.date)}
    if(a=="close")closeDay();
    if(a=="autoc"){if(!R.logo)return toast("ارفع الشعار أولاً من الأعلى");const r=await fromLogo(R.logo);if(!r)return toast("تعذر قراءة الشعار");$("#c1").value=r.c1;$("#c2").value=r.c2;pv();toast("اضغط حفظ الألوان لاعتمادها")}
    if(a=="savec"){try{await updateDoc(rr,{c1:$("#c1").value,c2:$("#c2").value});toast("تم حفظ الألوان")}catch(x){alert("تعذر الحفظ: "+(x.code||x.message))}}
    if(a=="su"){const v=$("#nu").value.trim().toLowerCase();if(!/^[a-z0-9._-]{3,}$/.test(v))return toast("اسم المستخدم: حروف إنجليزية وأرقام (3 أحرف على الأقل)");
      try{const q2=await getDocs(query(collection(db,"restaurants"),where("username","==",v)));if(q2.docs.some(d=>d.id!=rid))return toast("اسم المستخدم مستخدم");await updateDoc(rr,{username:v,em:auth.currentUser.email});toast("تم تغيير اسم المستخدم")}catch(x){alert("تعذر الحفظ: "+(x.code||x.message))}}
    if(a=="sp"){const cp=$("#cp").value,np=$("#np").value;if(np.length<6)return toast("كلمة السر الجديدة 6 أحرف على الأقل");const cu=auth.currentUser;
      try{await reauthenticateWithCredential(cu,EmailAuthProvider.credential(cu.email,cp));await updatePassword(cu,np);$("#cp").value="";$("#np").value="";toast("تم تغيير كلمة السر")}catch(x){toast(x.code=="auth/wrong-password"||x.code=="auth/invalid-credential"?"كلمة السر الحالية غير صحيحة":"تعذر التغيير: "+(x.code||""))}}
    if(a=="del"&&confirm("حذف هذه الوجبة؟"))deleteDoc(doc(rr,"items",id));
    if(a=="rd")updateDoc(doc(rr,"orders",id),{st:1});
    if(a=="add"){const n=$("#in").value.trim(),p=$("#ip").value,c=$("#ic").value.trim()||"عام";if(!n||!p)return toast("اكتب الاسم والسعر");
      await addDoc(collection(rr,"items"),{name:n,price:+p,cat:c,ok:true,img:img||"",ts:Date.now()});img=null;toast("تمت الإضافة")}
    if(a=="dl"){const c=$("#qr canvas"),l=document.createElement("a");l.href=c.toDataURL("image/png");l.download="qr-"+R.slug+".png";l.click()}};
}
</script>
</body>
</html>
